# Decision rule for naming a face from the gallery (src/facial_attendance/recognition/decision.py).
# The similarity threshold tau is not set here: it is read from the deployed checkpoint's
# meta["threshold"], where model selection recorded it (0.462, chosen for comparing one pair).
[decision]
# Name the best match only if its cosine score s1 >= max(tau, min_score) and s1 - s2 >= margin,
# where s2 is the best score of any other enrolled person (tau itself with one person enrolled).
#
# Why min_score: tau lets 1 % of different-person pairs through, but check-in compares a face
# with every enrolled person, so an unregistered person gets one chance per person. On LFW
# with 50 enrolled people, tau alone named 72.5 % of unregistered people.
#
# Source (2026-11-27): the deployed metric model with the GUI's square-1.2 crop, LFW press
# photos, one averaged template from 3 photos per person. The pair was chosen on one class of
# 50 people and 2015 unregistered people: the fewest strangers named while naming enrolled
# people at least as often as tau with margin 0.15, and no more wrong names. Measured on a
# second class of 50 other people and 2015 other unregistered people:
#   tau only                    97.6 % named correctly, 1.6 % wrong name, 72.5 % of strangers named
#   tau, margin 0.15            81.5 %, 0 %, 14.0 %
#   min_score 0.69, margin 0.10 82.7 %, 0 %,  5.1 %
# With 3-10 enrolled people the new rule names 0.5-1.4 % of strangers instead of 8-16 %, and
# 86-90 % of enrolled people instead of 95-98 % (the rest are asked to try again).
# LFW is not webcam footage and may overlap the training data: re-check on the webcam.
margin = 0.10
min_score = 0.69
