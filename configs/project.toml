# Resolve every relative path from the repository root, including in notebooks.
# These two defaults match the verified KaggleHub cache on this checkout.
# For manually extracted data or mounted Colab storage, change face_data or use
# check_face_data.py --data-root; no directory has to be renamed or copied.
[paths]
kaggle_cache = "data/.kagglehub"
face_data = "data/.kagglehub/competitions/11-785-fall-20-homework-2-part-2"
# Reserved storage: liveness is selected in liveness-protocol.json but not
# downloaded/audited; emotion data selection remains pending.
liveness_data = "data/raw/liveness"
emotion_data = "data/raw/emotion"
# Generated model weights and attendance records are kept out of version control.
checkpoints = "artifacts/checkpoints"
attendance = "artifacts/attendance"
