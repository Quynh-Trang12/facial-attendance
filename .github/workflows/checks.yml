name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    # Keep the existing Python 3.13 check name used by the branch ruleset.
    name: source-checks (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      # Exercise the inference weights shipped in the source submission.
      FA_FACE_CHECKPOINT: artifacts/models/recognition/face-recognition-resnet18.pt
      FA_LIVENESS_RELEASE: artifacts/models/liveness/liveness-inference.pt
      FA_LIVENESS_YUNET: artifacts/detectors/face_detection_yunet_2023mar.onnx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install CPU runtime and pinned source checker
        id: dependencies
        run: |
          python -m pip install -r requirements-cpu.txt
          python -m pip install -r requirements.txt ruff==0.17.6
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Prepare the pinned detector for native image-inference tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python scripts/preparation/prepare_liveness_detector.py
      - name: Run complete Linux behavior suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest discover -s tests -t . -v
      - name: Validate Python and TOML syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import tomllib
          for folder in ('src', 'scripts', 'tests'):
              for path in Path(folder).rglob('*.py'):
                  ast.parse(path.read_text(), filename=str(path))
          for path in [Path('pyproject.toml'), *Path('configs').glob('*.toml')]:
              tomllib.loads(path.read_text())
          PY
      - name: Inspect both submitted notebooks without datasets or checkpoints
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python scripts/run_liveness_notebook.py --action inspect
          python scripts/run_liveness_notebook.py --notebook notebooks/liveness-data-preparation-and-audit.ipynb --action inspect
      - name: Run CPU inference through the shared CLI
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest tests.liveness.test_liveness_inference.FrameIntegrationTests.test_shared_cli_runs_cpu_checkpoint_without_training_imports -v
      # Hosted CPU runners do not certify CUDA or physical webcam behavior.

  os-compatibility:
    name: OS compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      # Exercise the inference weights shipped in the source submission.
      FA_FACE_CHECKPOINT: artifacts/models/recognition/face-recognition-resnet18.pt
      FA_LIVENESS_RELEASE: artifacts/models/liveness/liveness-inference.pt
      FA_LIVENESS_YUNET: artifacts/detectors/face_detection_yunet_2023mar.onnx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
      - name: Install the target OS dependencies
        id: dependencies
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install -r requirements-cpu.txt
          fi
          # macOS uses native arm64 wheels from PyPI, not the CUDA index.
          python -m pip install -r requirements.txt
      - name: Prepare the pinned detector for native image-inference tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python scripts/preparation/prepare_liveness_detector.py
      - name: Run portable behavior tests (Linux staging tests report explicit skips)
        run: python -m unittest discover -s tests -t . -v
      - name: Inspect both submitted notebooks without datasets or checkpoints
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python scripts/run_liveness_notebook.py --action inspect
          python scripts/run_liveness_notebook.py --notebook notebooks/liveness-data-preparation-and-audit.ipynb --action inspect
      - name: Run CPU inference through the shared CLI
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest tests.liveness.test_liveness_inference.FrameIntegrationTests.test_shared_cli_runs_cpu_checkpoint_without_training_imports -v
      - name: Run a real CPU optimizer/inference step
        id: runtime
        # Preserve runtime evidence even if the independent unit-test step fails.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python scripts/check_environment.py --device cpu --operator github-os-review --output evidence/runs/SYS-03/github-os-review.json
      - name: Preserve the environment report
        if: ${{ !cancelled() && (steps.runtime.outcome == 'success' || steps.runtime.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: environment-${{ matrix.os }}
          path: evidence/runs/SYS-03/github-os-review.json
          if-no-files-found: error
