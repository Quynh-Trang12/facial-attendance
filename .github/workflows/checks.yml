name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install image-decoding dependency for fixture tests
        run: python -m pip install Pillow==11.2.1
      - name: Validate configuration and dataset loaders with generated fixtures
        run: python -m unittest discover -s tests -v
      - name: Validate Python and TOML syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import tomllib
          for folder in ('src', 'scripts', 'tests'):
              for path in Path(folder).rglob('*.py'):
                  ast.parse(path.read_text(), filename=str(path))
          for path in [Path('pyproject.toml'), *Path('configs').glob('*.toml')]:
              tomllib.loads(path.read_text())
          PY
      # Hosted CPU runners do not certify CUDA; run the documented GPU check on a host.
