name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    # Keep the existing Python 3.13 check name used by the branch ruleset.
    name: source-checks (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install fixture and evaluation dependencies
        run: python -m pip install Pillow==11.2.1 numpy==2.2.6 scikit-learn==1.9.1 matplotlib==3.10.3
      - name: Validate configuration and dataset loaders with generated fixtures
        run: python -m unittest discover -s tests -v
      - name: Validate Python and TOML syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import tomllib
          for folder in ('src', 'scripts', 'tests'):
              for path in Path(folder).rglob('*.py'):
                  ast.parse(path.read_text(), filename=str(path))
          for path in [Path('pyproject.toml'), *Path('configs').glob('*.toml')]:
              tomllib.loads(path.read_text())
          PY
      # Hosted CPU runners do not certify CUDA; run the documented GPU check on a host.

  os-compatibility:
    name: OS compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
      - name: Install the target OS dependencies
        id: dependencies
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install -r requirements-cpu.txt
          fi
          # macOS uses native arm64 wheels from PyPI, not the CUDA index.
          python -m pip install -r requirements.txt
      - name: Run configuration and loader tests
        run: python -m unittest discover -s tests -v
      - name: Run a real CPU optimizer/inference step
        id: runtime
        # Preserve runtime evidence even if the independent unit-test step fails.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python scripts/check_environment.py --device cpu --operator github-os-review --output reports/environment/github-os-review.json
      - name: Preserve the environment report
        if: ${{ !cancelled() && (steps.runtime.outcome == 'success' || steps.runtime.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: environment-${{ matrix.os }}
          path: reports/environment/github-os-review.json
          if-no-files-found: error
